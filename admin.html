<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>

  <link rel="stylesheet" href="./admin.css">

  <!-- Supabase harus dimuat lebih dahulu -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Config harus sebelum admin.js -->
  <script src="./config.js"></script>

  <!-- defer mempertahankan urutan eksekusi script -->
  <script src="./admin.js" defer></script>
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <div>
        <p class="eyebrow">Dashboard</p>
        <h1>Admin Panel</h1>
      </div>

      <div class="header-actions">
        <a href="index.html" class="button button-secondary">Website</a>
        <button id="logoutButton" class="button button-danger">
          Keluar
        </button>
      </div>
    </header>

    <div id="loadingState" class="state-card">
      Memuat dashboard...
    </div>

    <div id="errorState" class="state-card error hidden">
      <h2>Gagal memuat admin panel</h2>
      <p id="errorMessage"></p>
      <button id="retryButton" class="button button-primary">
        Coba Lagi
      </button>
    </div>

    <section id="adminContent" class="hidden">
      <div class="welcome-card">
        <p>Selamat datang,</p>
        <h2 id="adminName">Admin</h2>
        <span id="adminEmail"></span>
      </div>

      <section class="stats-grid">
        <article class="stat-card">
          <span>Projects</span>
          <strong id="statProjects">0</strong>
        </article>

        <article class="stat-card">
          <span>Services</span>
          <strong id="statServices">0</strong>
        </article>

        <article class="stat-card">
          <span>Orders</span>
          <strong id="statOrders">0</strong>
        </article>

        <article class="stat-card">
          <span>Messages</span>
          <strong id="statMessages">0</strong>
        </article>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Recent activity</p>
            <h2>Pesanan Terbaru</h2>
          </div>

          <button id="refreshButton" class="button button-secondary">
            Refresh
          </button>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Nama</th>
                <th>Email</th>
                <th>Layanan</th>
                <th>Status</th>
                <th>Tanggal</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody">
              <tr>
                <td colspan="5">Belum ada data.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
